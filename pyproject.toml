[project]
name = "dispatch"
version = "0.1.0"
description = "A stateful, extensible campaign mailer & delivery engine for MiyuLabs."
requires-python = ">=3.10"
dependencies = [
    "resend>=2.0.0",
    "jinja2>=3.1.0",
    "dnspython>=2.6.0",
]

[project.scripts]
dispatch = "dispatch.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["dispatch*"]

[tool.setuptools.package-data]
dispatch = ["templates/html/*.html"]
